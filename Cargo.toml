[package]
name = "powers-rs"
version = "0.2.0"
authors = ["Rogerio Alves"]
edition = "2021"
license = "MIT"
description = "An implementation of the Stochastic Dual Dynamic Programming (SDDP) algorithm in pure Rust, for the hydrothermal dispatch problem."
repository = "https://github.com/rjmalves/powers"
keywords = ["stochastic", "linear", "optimization", "hydrothermal", "SDDP"]

[[bin]]
name = "powers"
path = "src/main.rs"

[dependencies]
chrono = "0.4.41"
clap = { version = "4.5", features = ["derive"] }
csv = "1.3.1"
highs-sys = "1.6.4"
log = "0.4"  # Logging facade - zero-cost abstractions
atty = "0.2"  # Terminal detection for colored output
nalgebra = "0.33"
num_cpus = "1.16"
rand = "0.9.0"
rand_distr = "0.5.1"
rand_xoshiro = "0.7.0"
rayon = "1.10.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
statrs = "0.17"
thiserror = "2.0"

# Optional: mimalloc allocator for better memory management in HPC workloads
mimalloc = { version = "0.1", optional = true }

# Optional: jemalloc allocator for better memory management in HPC workloads
tikv-jemallocator = { version = "0.6", optional = true }

# libc for malloc_trim on Linux
libc = "0.2"

# Parquet output format support (always available)
arrow = "57"
parquet = "57"

[dev-dependencies]
approx = "0.5"
criterion = { version = "0.5", features = ["html_reports"] }
env_logger = "0.11"  # Simple logger for tests
proptest = "1.4"
tempfile = "3.13"

[features]
# Feature flag to enable expensive/slow tests that are normally ignored
expensive_tests = []
# Feature flag to enable SIMD optimizations for dot products
simd-optimizations = []
# Feature flag to use mimalloc as global allocator for better memory management
mimalloc = ["dep:mimalloc"]
# Feature flag to use jemalloc as global allocator for better memory management
jemalloc = ["dep:tikv-jemallocator"]
# Feature flag to opt-out of custom allocators and use system allocator
system-allocator = []
# Feature flag to enable timing collection
timing = []
# Feature flag to enable detailed per-stage timing (implies timing)
timing-detailed = ["timing"]

[[bench]]
name = "simd_dot_product"
harness = false

[[bench]]
name = "sddp_e2e"
harness = false

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[profile.release]
debug = true
